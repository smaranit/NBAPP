name: WF-13
on: workflow_dispatch
jobs:
  jobx:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
         os: [ubuntu-latest,ubuntu-slim]
         version: ["0.0.123","3.10","3.11","3.12"]
         exclude:
         - version: "3.12"
           os: ubuntu-slim
         include:
         - version: "3.13"
           os: ubuntu-latest         
    steps: 
    - name: Step1
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:deadsnakes/ppa
        sudo apt-get update
        sudo apt-get install -y python${{ matrix.version }} 
        sleep 60
    - name: Excute application
      run: 
         python --version      
          
          
         